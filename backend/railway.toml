# gigZee API — Railway service config
# Deploy with: railway up ./backend --path-as-root --service stagelink-api

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Must run via shell so $PORT expands (Railway does not expand ${PORT:-...} itself)
startCommand = "sh -c 'uvicorn server:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
